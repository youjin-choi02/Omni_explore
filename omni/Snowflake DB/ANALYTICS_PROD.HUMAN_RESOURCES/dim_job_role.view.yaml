    sql: '"JOB_ROLE_ID"'
    format: ID

  job_role_name:
    sql: '"JOB_ROLE_NAME"'

  job_level:
    sql: '"JOB_LEVEL"'

  exempt_status:
    sql: '"EXEMPT_STATUS"'

  job_family:
    sql: '"JOB_FAMILY"'

measures:
  count:
    aggregate_type: count
