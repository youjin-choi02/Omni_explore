# Reference this view as analytics_dev_customer_abc__inventory_items
catalog: ANALYTICS_DEV
schema: CUSTOMER_ABC
table_name: INVENTORY_ITEMS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  product_id:
    sql: '"PRODUCT_ID"'
    format: ID

  created_at:
    sql: '"CREATED_AT"'

  sold_at:
    sql: '"SOLD_AT"'

  cost:
    sql: '"COST"'

  product_name:
    sql: '"PRODUCT_NAME"'

  product_retail_price:
    sql: '"PRODUCT_RETAIL_PRICE"'

  product_sku:
    sql: '"PRODUCT_SKU"'

  product_distribution_center_id:
    sql: '"PRODUCT_DISTRIBUTION_CENTER_ID"'
    format: ID

measures:
  count:
    aggregate_type: count
