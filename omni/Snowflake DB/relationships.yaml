- join_from_view: analytics_dev_customer_abc__inventory_items
  join_to_view: analytics_dev_customer_abc__products
  join_type: always_left
  on_sql: ${analytics_dev_customer_abc__inventory_items.product_id} =
    ${analytics_dev_customer_abc__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_dev_customer_abc__order_items
  join_to_view: analytics_dev_customer_abc__users
  join_type: always_left
  on_sql: ${analytics_dev_customer_abc__order_items.user_id} =
    ${analytics_dev_customer_abc__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_dev_customer_abc__order_items
  join_to_view: analytics_dev_customer_abc__inventory_items
  join_type: always_left
  on_sql: ${analytics_dev_customer_abc__order_items.inventory_item_id} =
    ${analytics_dev_customer_abc__inventory_items.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_dev_customer_abc__order_items_agg
  join_to_view: analytics_dev_customer_abc__users
  join_type: always_left
  on_sql: ${analytics_dev_customer_abc__order_items_agg.user_id} =
    ${analytics_dev_customer_abc__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_dev_customer_abc__products
  join_to_view: analytics_dev_customer_abc__distribution_centers
  join_type: always_left
  on_sql: ${analytics_dev_customer_abc__products.distribution_center_id} =
    ${analytics_dev_customer_abc__distribution_centers.id}
  relationship_type: assumed_many_to_one
